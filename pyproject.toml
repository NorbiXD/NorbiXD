[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "darwin-challenge"
version = "0.1.0"
description = "DARWIN: a self-evolving population of competing AI crypto-futures trading agents"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "numpy>=2.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "websockets>=13.0",
    "httpx>=0.27",
    "sqlalchemy>=2.0",
    "pyarrow>=17.0",
    "duckdb>=1.1",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML",
]

[project.scripts]
darwin = "darwin.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/darwin"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"
markers = [
    "slow: long-running simulation tests",
]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PL", "N"]
ignore = [
    "PLR0913",  # engines legitimately take many collaborators
    "PLR0917",
    "PLR2004",  # magic values are fine in quant code with named config
    "PLR0911",
    "PLR0912",
    "PLR0915",
    "RUF001",
    "RUF002",
    "RUF003",
    "N818",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR2004", "S101", "PLC0415", "E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["darwin"]

[[tool.mypy.overrides]]
module = ["pyarrow.*", "duckdb.*", "uvicorn.*"]
ignore_missing_imports = true
